<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0b1120;">
  <defs>
    <!-- Blue copper acetate solution -->
    <linearGradient id="barfoedBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.85" />
      <stop offset="50%" stopColor="#38bdf8" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#0369a1" stopOpacity="0.9" />
    </linearGradient>

    <!-- Brick red cuprous oxide pellet -->
    <linearGradient id="cu2oPelletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#991b1b" />
      <stop offset="50%" stopColor="#dc2626" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.3" />
      <stop offset="20%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="80%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Station Header -->
  <g id="header">
    <rect x="30" y="24" width="500" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="46" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">
      BIOCHEMISTRY PRACTICAL OSPE • MONOSACCHARIDE SPECIFICITY
    </text>
    <text x="45" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      Barfoed's Test (Cupric Acetate in Weak Acetic Acid — 2.5 to 3 Minutes Boiling)
    </text>
  </g>

  <!-- Boiling Water Bath Beaker -->
  <g id="water-bath" opacity="0.95">
    <rect x="180" y="160" width="440" height="380" rx="20" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="3" />
    <line x1="200" y1="240" x2="240" y2="240" stroke="#64748b" stroke-width="2" />
    <text x="248" y="244" fill="#64748b" font-family="monospace" font-size="10">Water Bath 100°C</text>
    <rect x="186" y="240" width="428" height="294" rx="14" fill="#0284c7" fill-opacity="0.1" />
  </g>

  <!-- TUBE A: Reducing Monosaccharide (Glucose) -> Red Cu2O precipitate in 2.5 min -->
  <g id="tube-monosaccharide" transform="translate(260, 90)">
    <rect x="0" y="0" width="56" height="360" rx="28" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Blue solution with bottom red precipitate -->
    <path d="M 3 140 L 53 140 L 53 332 A 25 25 0 0 1 3 332 Z" fill="url(#barfoedBlueGrad)" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="#0284c7" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="none" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Sharp Red Cuprous Oxide (Cu2O) Precipitate at bottom of tube -->
    <path d="M 3 295 C 12 300, 44 300, 53 295 L 53 332 A 25 25 0 0 1 3 332 Z" fill="url(#cu2oPelletGrad)" />
    <circle cx="20" cy="315" r="2.5" fill="#fca5a5" />
    <circle cx="36" cy="320" r="2" fill="#fca5a5" />

    <rect x="0" y="0" width="56" height="360" rx="28" fill="url(#glassReflect)" />

    <!-- Label -->
    <rect x="-14" y="380" width="84" height="42" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" />
    <text x="28" y="398" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Tube A
    </text>
    <text x="28" y="413" fill="#f87171" font-family="monospace" font-size="9" text-anchor="middle">
      Red Ppt (2.5 min)
    </text>

    <!-- Neutral Marker ① -->
    <g transform="translate(28, 250)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        ①
      </text>
    </g>
  </g>

  <!-- TUBE B: Disaccharide (Lactose/Maltose) -> Remains Clear Blue in < 3 min -->
  <g id="tube-disaccharide" transform="translate(480, 90)">
    <rect x="0" y="0" width="56" height="360" rx="28" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M 3 140 L 53 140 L 53 332 A 25 25 0 0 1 3 332 Z" fill="url(#barfoedBlueGrad)" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="#0284c7" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="none" stroke="#bae6fd" stroke-width="1.5" />

    <rect x="0" y="0" width="56" height="360" rx="28" fill="url(#glassReflect)" />

    <!-- Label -->
    <rect x="-14" y="380" width="84" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="28" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Tube B
    </text>
    <text x="28" y="413" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">
      Clear Blue
    </text>
  </g>

  <!-- Bottom Explanatory footer -->
  <text x="400" y="575" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Weakly acidic medium retards reduction by disaccharides; only free monosaccharides reduce Cu²⁺ within 3 minutes.
  </text>
</svg>
