<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0b1120;">
  <defs>
    <!-- Starch Iodine Blue-Black Gradient -->
    <linearGradient id="blueBlackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="30%" stopColor="#1e1b4b" />
      <stop offset="60%" stopColor="#172554" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Iodine Reagent Yellow-Brown / Amber Gradient -->
    <linearGradient id="amberIodineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#b45309" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#f59e0b" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#92400e" stopOpacity="0.9" />
    </linearGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.3" />
      <stop offset="20%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="80%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Practical Station Header -->
  <g id="header">
    <rect x="30" y="24" width="460" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="46" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">
      BIOCHEMISTRY PRACTICAL OSPE • POLYSACCHARIDES
    </text>
    <text x="45" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      Lugol's Iodine Test (Amylose / Starch Inclusion Complex vs Monosaccharide)
    </text>
  </g>

  <!-- Test Tube Rack -->
  <g id="rack" opacity="0.9">
    <rect x="140" y="380" width="520" height="24" rx="4" fill="#334155" />
    <rect x="140" y="460" width="520" height="20" rx="4" fill="#1e293b" stroke="#475569" />
    <rect x="160" y="404" width="16" height="56" fill="#475569" />
    <rect x="624" y="404" width="16" height="56" fill="#475569" />
  </g>

  <!-- TUBE 1: Starch Solution + Iodine (Deep Blue-Black Complex) -->
  <g id="tube-starch" transform="translate(260, 110)">
    <rect x="0" y="0" width="60" height="340" rx="30" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Deep Blue-Black Liquid -->
    <path d="M 3 130 L 57 130 L 57 310 A 27 27 0 0 1 3 310 Z" fill="url(#blueBlackGrad)" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="#1e1b4b" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="none" stroke="#60a5fa" stroke-width="1" />
    <!-- Glass Highlights -->
    <rect x="0" y="0" width="60" height="340" rx="30" fill="url(#glassReflect)" />

    <!-- Label -->
    <rect x="-14" y="385" width="88" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="30" y="403" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Tube 1: Starch
    </text>
    <text x="30" y="418" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">
      Deep Blue-Black
    </text>

    <!-- Neutral Marker ① -->
    <g transform="translate(30, 210)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        ①
      </text>
    </g>
  </g>

  <!-- TUBE 2: Monosaccharide (Glucose) + Iodine (Remains Yellow-Brown / Amber) -->
  <g id="tube-monosaccharide" transform="translate(480, 110)">
    <rect x="0" y="0" width="60" height="340" rx="30" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Amber Yellow-Brown Liquid -->
    <path d="M 3 130 L 57 130 L 57 310 A 27 27 0 0 1 3 310 Z" fill="url(#amberIodineGrad)" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="#d97706" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="none" stroke="#fef08a" stroke-width="1" />
    <!-- Glass Highlights -->
    <rect x="0" y="0" width="60" height="340" rx="30" fill="url(#glassReflect)" />

    <!-- Label -->
    <rect x="-16" y="385" width="92" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="30" y="403" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Tube 2: Glucose
    </text>
    <text x="30" y="418" fill="#fbbf24" font-family="monospace" font-size="9" text-anchor="middle">
      Yellow-Brown
    </text>
  </g>

  <!-- Explanatory note -->
  <text x="400" y="565" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Amylose forms a helical coil that traps polyiodide ions (I₅⁻), producing an intense blue-black chromophore.
  </text>
</svg>
