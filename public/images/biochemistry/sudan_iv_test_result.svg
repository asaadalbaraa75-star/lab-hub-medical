<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0b1120;">
  <defs>
    <!-- Upper Scarlet Red Lipid / Oil Layer -->
    <linearGradient id="sudanRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#dc2626" />
      <stop offset="40%" stopColor="#ef4444" />
      <stop offset="80%" stopColor="#b91c1c" />
      <stop offset="100%" stopColor="#991b1b" />
    </linearGradient>

    <!-- Lower Clear Aqueous Layer -->
    <linearGradient id="clearWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f8fafc" stopOpacity="0.3" />
      <stop offset="50%" stopColor="#f1f5f9" stopOpacity="0.2" />
      <stop offset="100%" stopColor="#e2e8f0" stopOpacity="0.35" />
    </linearGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.3" />
      <stop offset="20%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="80%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Station Header -->
  <g id="header">
    <rect x="30" y="24" width="480" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="46" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">
      BIOCHEMISTRY PRACTICAL OSPE • LIPID SOLUBILITY DYE
    </text>
    <text x="45" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      Sudan IV Test (Non-Polar Lysochrome Dye Selective Partitioning in Triglycerides)
    </text>
  </g>

  <!-- Test Tube -->
  <g id="sudan-tube" transform="translate(365, 80)">
    <rect x="0" y="0" width="70" height="380" rx="35" fill="none" stroke="#94a3b8" stroke-width="3" />

    <!-- Upper Floating Red Lipid Ring / Layer -->
    <path d="M 3 130 L 67 130 L 67 195 L 3 195 Z" fill="url(#sudanRedGrad)" />
    <ellipse cx="35" cy="130" rx="32" ry="5" fill="#ef4444" />
    <ellipse cx="35" cy="130" rx="32" ry="5" fill="none" stroke="#fca5a5" stroke-width="1.5" />

    <!-- Lower Clear Aqueous Layer -->
    <path d="M 3 195 L 67 195 L 67 345 A 32 32 0 0 1 3 345 Z" fill="url(#clearWaterGrad)" />
    <ellipse cx="35" cy="195" rx="32" ry="4" fill="#cbd5e1" opacity="0.4" />

    <!-- Glass Highlights -->
    <rect x="0" y="0" width="70" height="380" rx="35" fill="url(#glassReflect)" />

    <!-- Labels & Callouts -->
    <line x1="72" y1="160" x2="160" y2="160" stroke="#ef4444" stroke-width="2" />
    <text x="170" y="164" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
      Upper Layer: Bright Red Lipid / Triglyceride Layer (Sudan IV Soluble)
    </text>

    <line x1="72" y1="260" x2="160" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="170" y="264" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">
      Lower Layer: Clear Aqueous Phase (Dye Insoluble)
    </text>

    <!-- Neutral Marker ① -->
    <g transform="translate(35, 162)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        ①
      </text>
    </g>
  </g>

  <!-- Explanation footer -->
  <text x="400" y="565" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Sudan IV is a hydrophobic diazo dye that dissolves preferentially in hydrocarbons and fats, staining them scarlet red.
  </text>
</svg>
