<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0b1120;">
  <defs>
    <!-- Biuret Positive Purple / Violet Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#6b21a8" />
      <stop offset="40%" stopColor="#9333ea" />
      <stop offset="80%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#581c87" />
    </linearGradient>

    <!-- Negative Reagent Pale Blue Gradient -->
    <linearGradient id="blankBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.75" />
      <stop offset="50%" stopColor="#7dd3fc" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0.8" />
    </linearGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.3" />
      <stop offset="20%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="80%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Practical Station Header -->
  <g id="header">
    <rect x="30" y="24" width="460" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="46" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">
      BIOCHEMISTRY PRACTICAL OSPE • PROTEINS &amp; PEPTIDES
    </text>
    <text x="45" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      Biuret Reaction: Cu²⁺ Coordination Complex with ≥ 2 Peptide Bonds
    </text>
  </g>

  <!-- Test Tube Rack -->
  <g id="rack" opacity="0.9">
    <rect x="140" y="380" width="520" height="24" rx="4" fill="#334155" />
    <rect x="140" y="460" width="520" height="20" rx="4" fill="#1e293b" stroke="#475569" />
    <rect x="160" y="404" width="16" height="56" fill="#475569" />
    <rect x="624" y="404" width="16" height="56" fill="#475569" />
  </g>

  <!-- TUBE A: Negative (Water + Biuret Reagent) -> Sky Blue -->
  <g id="tube-blank" transform="translate(260, 110)">
    <rect x="0" y="0" width="60" height="340" rx="30" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M 3 130 L 57 130 L 57 310 A 27 27 0 0 1 3 310 Z" fill="url(#blankBlueGrad)" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="#0284c7" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="none" stroke="#bae6fd" stroke-width="1" />
    <rect x="0" y="0" width="60" height="340" rx="30" fill="url(#glassReflect)" />

    <!-- Label -->
    <rect x="-14" y="385" width="88" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="30" y="403" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Tube A: Blank
    </text>
    <text x="30" y="418" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">
      Sky Blue (Cu²⁺)
    </text>
  </g>

  <!-- TUBE B: Positive (Albumin/Protein + Biuret Reagent) -> Intense Violet / Purple -->
  <g id="tube-protein" transform="translate(480, 110)">
    <rect x="0" y="0" width="60" height="340" rx="30" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M 3 130 L 57 130 L 57 310 A 27 27 0 0 1 3 310 Z" fill="url(#purpleGrad)" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="#7e22ce" />
    <ellipse cx="30" cy="130" rx="27" ry="4.5" fill="none" stroke="#e9d5ff" stroke-width="1" />
    <rect x="0" y="0" width="60" height="340" rx="30" fill="url(#glassReflect)" />

    <!-- Label -->
    <rect x="-16" y="385" width="92" height="42" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="30" y="403" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Tube B: Albumin
    </text>
    <text x="30" y="418" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
      Violet / Purple
    </text>

    <!-- Neutral Marker ① -->
    <g transform="translate(30, 210)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        ①
      </text>
    </g>
  </g>

  <!-- Explanation footer -->
  <text x="400" y="565" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Requires at least two peptide bonds (-CO-NH-) in alkaline solution to chelate cupric ions (Cu²⁺).
  </text>
</svg>
