<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #090d16;">
  <defs>
    <!-- Liquid gradients -->
    <linearGradient id="negBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#38bdf8" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#0369a1" stopOpacity="0.85" />
    </linearGradient>

    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#65a30d" stopOpacity="0.85" />
      <stop offset="50%" stopColor="#a3e635" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#4d7c0f" stopOpacity="0.9" />
    </linearGradient>

    <linearGradient id="brickRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#991b1b" />
      <stop offset="40%" stopColor="#dc2626" />
      <stop offset="70%" stopColor="#b91c1c" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.25" />
      <stop offset="15%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="85%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Laboratory Station Banner -->
  <g id="station-tag">
    <rect x="30" y="24" width="420" height="46" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <text x="45" y="46" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">
      BIOCHEMISTRY PRACTICAL OSPE • CARBOHYDRATES
    </text>
    <text x="45" y="60" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Benedict's Reagent Test Reaction (3 min boiling in water bath)
    </text>
  </g>

  <!-- Water Bath Beaker & Stand -->
  <g id="water-bath" opacity="0.95">
    <!-- Beaker body -->
    <rect x="180" y="160" width="440" height="380" rx="20" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="3" />
    <!-- Beaker Lip and Graduations -->
    <line x1="200" y1="220" x2="240" y2="220" stroke="#64748b" stroke-width="2" />
    <text x="248" y="224" fill="#64748b" font-family="monospace" font-size="10">400 mL</text>
    <line x1="200" y1="300" x2="240" y2="300" stroke="#64748b" stroke-width="2" />
    <text x="248" y="304" fill="#64748b" font-family="monospace" font-size="10">300 mL</text>
    <line x1="200" y1="380" x2="240" y2="380" stroke="#64748b" stroke-width="2" />
    <text x="248" y="384" fill="#64748b" font-family="monospace" font-size="10">200 mL</text>

    <!-- Water in Beaker with Boiling Bubbles -->
    <rect x="186" y="240" width="428" height="294" rx="14" fill="#0284c7" fill-opacity="0.12" />
    <!-- Rising Heat & Bubbles -->
    <circle cx="260" cy="460" r="4" fill="#38bdf8" opacity="0.5" />
    <circle cx="270" cy="380" r="5" fill="#38bdf8" opacity="0.4" />
    <circle cx="390" cy="480" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="410" cy="390" r="6" fill="#38bdf8" opacity="0.4" />
    <circle cx="510" cy="450" r="5" fill="#38bdf8" opacity="0.5" />
    <circle cx="525" cy="350" r="7" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- TEST TUBE 1: Negative Result (Control / Sucrose / Water) -->
  <g id="tube-negative" transform="translate(230, 90)">
    <!-- Tube Glass Outline -->
    <rect x="0" y="0" width="56" height="360" rx="28" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Blue Reagent (Unreduced Cu²⁺) -->
    <path d="M 3 140 L 53 140 L 53 332 A 25 25 0 0 1 3 332 Z" fill="url(#negBlueGrad)" />
    <!-- Meniscus curve -->
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="#0284c7" opacity="0.8" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="none" stroke="#bae6fd" stroke-width="1.5" />
    <!-- Glass Highlights -->
    <rect x="0" y="0" width="56" height="360" rx="28" fill="url(#glassReflection)" />
    <!-- Label Below Tube -->
    <rect x="-10" y="375" width="76" height="24" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="28" y="391" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      Control (-)
    </text>
    <text x="28" y="414" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">
      Clear Blue
    </text>
  </g>

  <!-- TEST TUBE 2: Trace / Moderate (0.5% - 1%) -->
  <g id="tube-trace" transform="translate(370, 90)">
    <!-- Tube Glass Outline -->
    <rect x="0" y="0" width="56" height="360" rx="28" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Greenish/Yellow Liquid -->
    <path d="M 3 140 L 53 140 L 53 332 A 25 25 0 0 1 3 332 Z" fill="url(#traceGrad)" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="#65a30d" opacity="0.8" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="none" stroke="#d9f99d" stroke-width="1.5" />
    <!-- Glass Highlights -->
    <rect x="0" y="0" width="56" height="360" rx="28" fill="url(#glassReflection)" />
    <!-- Label Below Tube -->
    <rect x="-10" y="375" width="76" height="24" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="28" y="391" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      Sample A
    </text>
    <text x="28" y="414" fill="#a3e635" font-family="monospace" font-size="9" text-anchor="middle">
      Green (+1)
    </text>
  </g>

  <!-- TEST TUBE 3: STRONGLY POSITIVE (Unknown Patient Urine Sample > 2% Glucose) -->
  <g id="tube-positive-brick-red" transform="translate(510, 90)">
    <!-- Tube Glass Outline -->
    <rect x="0" y="0" width="56" height="360" rx="28" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <!-- Dense Brick-Red Solution with Heavy Cu2O Precipitate -->
    <path d="M 3 140 L 53 140 L 53 332 A 25 25 0 0 1 3 332 Z" fill="url(#brickRedGrad)" />
    <!-- Meniscus -->
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="#b91c1c" />
    <ellipse cx="28" cy="140" rx="25" ry="4" fill="none" stroke="#fca5a5" stroke-width="1.5" />
    
    <!-- Dense Insoluble Cuprous Oxide (Cu2O) Precipitate settling at bottom -->
    <path d="M 3 260 C 15 275, 40 275, 53 260 L 53 332 A 25 25 0 0 1 3 332 Z" fill="#7f1d1d" />
    <!-- Particulate texture in precipitate -->
    <circle cx="18" cy="290" r="2.5" fill="#f87171" opacity="0.6" />
    <circle cx="34" cy="305" r="3" fill="#f87171" opacity="0.6" />
    <circle cx="25" cy="325" r="2" fill="#fca5a5" opacity="0.7" />
    <circle cx="40" cy="285" r="2" fill="#fca5a5" opacity="0.7" />

    <!-- Glass Highlights -->
    <rect x="0" y="0" width="56" height="360" rx="28" fill="url(#glassReflection)" />

    <!-- Label Below Tube -->
    <rect x="-16" y="375" width="88" height="24" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1.5" />
    <text x="28" y="391" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      Patient Urine
    </text>
    <text x="28" y="414" fill="#f87171" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
      Brick-Red (Cu₂O)
    </text>

    <!-- Neutral Marker ① Over Sample Tube -->
    <g transform="translate(28, 220)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="r" values="22;26;22" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        ①
      </text>
    </g>
  </g>

  <!-- Bottom Instructions Bar -->
  <text x="400" y="575" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Observe Tube ①: Distinct Brick-Red Precipitate indicates high concentration of reducing sugars (≥ 2%).
  </text>
</svg>
