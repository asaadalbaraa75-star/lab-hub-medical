<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0b1120;">
  <defs>
    <!-- Upper carbohydrate layer (clear pale yellowish/white) -->
    <linearGradient id="upperCarbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f8fafc" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#f1f5f9" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#e2e8f0" stopOpacity="0.45" />
    </linearGradient>

    <!-- Lower dense conc. H2SO4 layer -->
    <linearGradient id="lowerAcidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#94a3b8" stopOpacity="0.5" />
      <stop offset="50%" stopColor="#cbd5e1" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#64748b" stopOpacity="0.6" />
    </linearGradient>

    <!-- Purple/Violet Ring at junction -->
    <linearGradient id="purpleRingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#a855f7" stopOpacity="0" />
      <stop offset="30%" stopColor="#7e22ce" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#581c87" stopOpacity="1" />
      <stop offset="70%" stopColor="#7e22ce" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#9333ea" stopOpacity="0" />
    </linearGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.3" />
      <stop offset="20%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="80%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Station Header -->
  <g id="header">
    <rect x="30" y="24" width="480" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="46" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">
      BIOCHEMISTRY PRACTICAL OSPE • GENERAL CARBOHYDRATE TEST
    </text>
    <text x="45" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      Molisch's Test: Dehydration by Conc. H₂SO₄ &amp; Condensation with α-Naphthol
    </text>
  </g>

  <!-- Inclined Test Tube Showing the Two Phases and Ring -->
  <g id="molisch-tube" transform="translate(370, 70)">
    <!-- Tube Body -->
    <rect x="0" y="0" width="70" height="380" rx="35" fill="none" stroke="#94a3b8" stroke-width="3" />

    <!-- Upper Aqueous Carbohydrate Layer + α-Naphthol -->
    <path d="M 3 100 L 67 100 L 67 240 L 3 240 Z" fill="url(#upperCarbGrad)" />
    <ellipse cx="35" cy="100" rx="32" ry="5" fill="#f8fafc" opacity="0.5" />
    <ellipse cx="35" cy="100" rx="32" ry="5" fill="none" stroke="#ffffff" stroke-width="1.5" />

    <!-- Lower Dense Acid Layer (conc. H2SO4) -->
    <path d="M 3 240 L 67 240 L 67 345 A 32 32 0 0 1 3 345 Z" fill="url(#lowerAcidGrad)" />

    <!-- Characteristic PURPLE / VIOLET RING at the junction of the two liquids -->
    <rect x="3" y="225" width="64" height="30" rx="4" fill="url(#purpleRingGrad)" />
    <!-- Sharp intense central band -->
    <ellipse cx="35" cy="240" rx="31" ry="4" fill="#3b0764" />
    <ellipse cx="35" cy="240" rx="31" ry="4" fill="none" stroke="#c084fc" stroke-width="2" />

    <!-- Glass Reflection -->
    <rect x="0" y="0" width="70" height="380" rx="35" fill="url(#glassReflect)" />

    <!-- Phase Callout Lines -->
    <line x1="72" y1="160" x2="160" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="170" y="164" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">
      Upper Layer: Carbohydrate + α-Naphthol
    </text>

    <line x1="72" y1="240" x2="160" y2="240" stroke="#c084fc" stroke-width="2" />
    <text x="170" y="244" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
      Purple / Violet Ring at Interface
    </text>

    <line x1="72" y1="300" x2="160" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="170" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">
      Lower Layer: Concentrated H₂SO₄ (Dense)
    </text>

    <!-- Neutral Marker ① -->
    <g transform="translate(35, 240)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        ①
      </text>
    </g>
  </g>

  <!-- Bottom Explanatory footer -->
  <text x="400" y="565" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    All carbohydrates dehydrate in strong acid to form furfural derivatives that condense with α-naphthol.
  </text>
</svg>
