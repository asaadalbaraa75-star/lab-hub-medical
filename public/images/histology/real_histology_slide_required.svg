<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0b1120;">
  <defs>
    <!-- Grid pattern simulating microscopic stage micrometers -->
    <pattern id="microscopeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>

    <linearGradient id="holderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
  </defs>

  <!-- Background grid -->
  <rect width="800" height="600" fill="url(#microscopeGrid)" />

  <!-- Glass Slide Boundary Outline -->
  <rect x="120" y="80" width="560" height="440" rx="16" fill="url(#holderGrad)" stroke="#334155" stroke-width="2" />

  <!-- Microscope Field Aperture (Circular Reticle) -->
  <circle cx="400" cy="270" r="140" fill="#090d16" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;16" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Reticle Crosshairs -->
  <line x1="240" y1="270" x2="560" y2="270" stroke="#0ea5e9" stroke-width="1" opacity="0.35" />
  <line x1="400" y1="110" x2="400" y2="430" stroke="#0ea5e9" stroke-width="1" opacity="0.35" />

  <!-- Microscope Objective Icon / Badge -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M -12 -14 L 12 -14 L 8 16 L -8 16 Z" fill="#0284c7" />
    <circle cx="0" cy="22" r="5" fill="#38bdf8" />
  </g>

  <!-- Primary Mandatory Text Badge -->
  <g transform="translate(400, 320)">
    <rect x="-190" y="-18" width="380" height="36" rx="8" fill="#e11d48" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="6" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      REAL HISTOLOGY SLIDE REQUIRED
    </text>
  </g>

  <!-- Explanation & Academic Policy -->
  <text x="400" y="380" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Verified Whole-Slide Microscopy Placeholder
  </text>
  <text x="400" y="405" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">
    In accordance with medical education guidelines, AI-generated tissue simulations are strictly prohibited.
  </text>
  <text x="400" y="425" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">
    Upload or configure authentic university-scanned H&amp;E whole-slide imagery via the Media Administrator.
  </text>

  <!-- Scale bar -->
  <g transform="translate(400, 480)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#94a3b8" stroke-width="2" />
    <line x1="-50" y1="-5" x2="-50" y2="5" stroke="#94a3b8" stroke-width="2" />
    <line x1="50" y1="-5" x2="50" y2="5" stroke="#94a3b8" stroke-width="2" />
    <text x="0" y="16" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">
      100 µm Scale Bar
    </text>
  </g>
</svg>
