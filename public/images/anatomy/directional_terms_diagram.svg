<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0B1120"/>
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#38BDF8" text-anchor="middle">ANATOMICAL DIRECTIONAL TERMS</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Relative Spatial Orientation in Human Anatomy</text>

  <!-- Human Silhouette -->
  <g transform="translate(400, 310)" stroke="#94A3B8" stroke-width="2.5" fill="#1E293B">
    <circle cx="0" cy="-190" r="32"/>
    <path d="M-8,-160 L-8,-140 L8,-140 L8,-160 Z"/>
    <path d="M-45,-140 L45,-140 L35,-20 L-35,-20 Z"/>
    <path d="M-35,-20 L35,-20 L25,40 L-25,40 Z"/>
    <path d="M-45,-135 L-75,-40 L-80,50" stroke-linecap="round"/>
    <circle cx="-80" cy="65" r="10"/>
    <path d="M45,-135 L75,-40 L80,50" stroke-linecap="round"/>
    <circle cx="80" cy="65" r="10"/>
    <path d="M-20,40 L-25,140 L-25,230" stroke-linecap="round"/>
    <ellipse cx="-25" cy="235" rx="8" ry="14"/>
    <path d="M20,40 L25,140 L25,230" stroke-linecap="round"/>
    <ellipse cx="25" cy="235" rx="8" ry="14"/>
  </g>

  <!-- SUPERIOR / INFERIOR AXIS (Vertical Amber) -->
  <line x1="260" y1="120" x2="260" y2="520" stroke="#F59E0B" stroke-width="3"/>
  <polygon points="260,110 252,130 268,130" fill="#F59E0B"/>
  <polygon points="260,530 252,510 268,510" fill="#F59E0B"/>
  <rect x="140" y="100" width="105" height="36" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="192" y="123" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">SUPERIOR ↑</text>
  <rect x="140" y="500" width="105" height="36" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="192" y="523" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">INFERIOR ↓</text>

  <!-- MEDIAL / LATERAL AXIS (Horizontal Cyan) -->
  <line x1="400" y1="280" x2="620" y2="280" stroke="#06B6D4" stroke-width="3"/>
  <polygon points="390,280 410,272 410,288" fill="#06B6D4"/>
  <polygon points="630,280 610,272 610,288" fill="#06B6D4"/>
  <rect x="350" y="240" width="100" height="30" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#06B6D4" text-anchor="middle">MEDIAL ←</text>
  <rect x="580" y="240" width="100" height="30" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="630" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#06B6D4" text-anchor="middle">→ LATERAL</text>

  <!-- PROXIMAL / DISTAL (Right Limb Purple) -->
  <line x1="510" y1="360" x2="550" y2="480" stroke="#A855F7" stroke-width="3"/>
  <polygon points="506,350 505,370 519,365" fill="#A855F7"/>
  <polygon points="554,490 540,477 554,472" fill="#A855F7"/>
  <rect x="530" y="340" width="100" height="30" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
  <text x="580" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#A855F7" text-anchor="middle">PROXIMAL</text>
  <rect x="570" y="470" width="90" height="30" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
  <text x="615" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#A855F7" text-anchor="middle">DISTAL</text>

  <!-- ANTERIOR / POSTERIOR BOX -->
  <g transform="translate(60, 280)">
    <rect width="180" height="70" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">Ventral / Anterior</text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Toward Front of Body</text>
    <text x="90" y="62" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">vs Dorsal / Posterior (Back)</text>
  </g>
</svg>