<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0B1120"/>
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#38BDF8" text-anchor="middle">CARDINAL ANATOMICAL PLANES</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Standard Anatomical Position (Palms Supinated)</text>
  
  <!-- Human Silhouette representation -->
  <g transform="translate(400, 310)" stroke="#CBD5E1" stroke-width="2.5" fill="#1E293B" opacity="0.95">
    <!-- Head -->
    <circle cx="0" cy="-190" r="32"/>
    <!-- Neck -->
    <path d="M-8,-160 L-8,-140 L8,-140 L8,-160 Z"/>
    <!-- Torso -->
    <path d="M-45,-140 L45,-140 L35,-20 L-35,-20 Z"/>
    <!-- Pelvis -->
    <path d="M-35,-20 L35,-20 L25,40 L-25,40 Z"/>
    <!-- Left Arm -->
    <path d="M-45,-135 L-70,-40 L-75,50" stroke-linecap="round"/>
    <circle cx="-75" cy="65" r="10"/>
    <!-- Right Arm -->
    <path d="M45,-135 L70,-40 L75,50" stroke-linecap="round"/>
    <circle cx="75" cy="65" r="10"/>
    <!-- Left Leg -->
    <path d="M-20,40 L-25,140 L-25,230" stroke-linecap="round"/>
    <ellipse cx="-25" cy="235" rx="8" ry="14"/>
    <!-- Right Leg -->
    <path d="M20,40 L25,140 L25,230" stroke-linecap="round"/>
    <ellipse cx="25" cy="235" rx="8" ry="14"/>
  </g>

  <!-- MIDSAGITTAL PLANE (Vertical Red/Pink) -->
  <polygon points="400,100 400,530 400,530 400,100" stroke="#F43F5E" stroke-width="4" fill="none"/>
  <polygon points="385,90 415,90 415,540 385,540" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-dasharray="6,4" stroke-width="2"/>
  
  <!-- CORONAL / FRONTAL PLANE (Vertical Blue/Cyan) -->
  <polygon points="180,240 620,240 650,420 210,420" fill="#0EA5E9" fill-opacity="0.18" stroke="#0EA5E9" stroke-width="2"/>
  
  <!-- TRANSVERSE / HORIZONTAL PLANE (Green/Emerald) -->
  <polygon points="230,310 570,310 530,360 190,360" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="2.5"/>

  <!-- LABELS & CALLOUTS -->
  <!-- Sagittal -->
  <g transform="translate(60, 160)">
    <rect width="200" height="75" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <text x="100" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#F43F5E" text-anchor="middle">Median / Midsagittal</text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Divides body into</text>
    <text x="100" y="64" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F43F5E" text-anchor="middle">Equal Right &amp; Left</text>
    <line x1="200" y1="37" x2="380" y2="120" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Coronal -->
  <g transform="translate(540, 160)">
    <rect width="200" height="75" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="2"/>
    <text x="100" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0EA5E9" text-anchor="middle">Coronal / Frontal</text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Divides body into</text>
    <text x="100" y="64" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0EA5E9" text-anchor="middle">Anterior &amp; Posterior</text>
    <line x1="0" y1="37" x2="-80" y2="100" stroke="#0EA5E9" stroke-width="2"/>
  </g>

  <!-- Transverse -->
  <g transform="translate(60, 390)">
    <rect width="200" height="75" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#10B981" text-anchor="middle">Transverse / Axial</text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Divides body into</text>
    <text x="100" y="64" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">Superior &amp; Inferior</text>
    <line x1="200" y1="37" x2="270" y2="340" stroke="#10B981" stroke-width="2"/>
  </g>
</svg>